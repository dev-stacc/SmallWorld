apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  timeout: 15m
  install:
    timeout: 15m
  upgrade:
    timeout: 15m
  chart:
    spec:
      chart: authentik
      version: "2026.8.5"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  values:
    # secret_key and postgresql.password are deliberately omitted. They used to
    # be Flux substitution placeholders (AUTHENTIK_SECRET_KEY and
    # AUTHENTIK_POSTGRESQL_PASSWORD) that were never defined in the
    # cluster-config ConfigMap, so strict-mode substitution failed and
    # apps-config had not applied since 2026-06-15. Both values reach authentik
    # as env vars from the authentik-secrets ExternalSecret via global.envFrom
    # below, which is what authentik actually reads.
    global:
      env:
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "true"
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
      envFrom:
        - secretRef:
            name: authentik-secrets
        - secretRef:
            name: authentik-blueprint-grafana-env
            optional: true
        - secretRef:
            name: authentik-blueprint-jellyfin-env
            optional: true
        - secretRef:
            name: authentik-blueprint-nextcloud-env
            optional: true
        - secretRef:
            name: authentik-blueprint-immich-env
            optional: true
        - secretRef:
            name: authentik-blueprint-forgejo-env
            optional: true
        - secretRef:
            name: authentik-blueprint-audiobookshelf-env
            optional: true
    blueprints:
      configMaps:
        - authentik-blueprint-access
        - authentik-blueprint-grafana
        - authentik-blueprint-media
        - authentik-blueprint-outpost
        - authentik-blueprint-jellyfin-oidc
        - authentik-blueprint-nextcloud-oidc
        - authentik-blueprint-sewing-assistant
        - authentik-blueprint-marketing-tool
        - authentik-blueprint-kiwix
        - authentik-blueprint-open-webui
        - authentik-blueprint-immich-oidc
        - authentik-blueprint-forgejo-oidc
        - authentik-blueprint-audiobookshelf-oidc
    postgresql:
      enabled: true
      auth:
        existingSecret: authentik-secrets
        secretKeys:
          adminPasswordKey: postgresql-postgres-password
          userPasswordKey: postgresql-password
      primary:
        nodeSelector:
          kubernetes.io/hostname: asta
        persistence:
          enabled: true
          storageClass: local-path
          size: 8Gi
    redis:
      enabled: true
      master:
        persistence:
          enabled: false

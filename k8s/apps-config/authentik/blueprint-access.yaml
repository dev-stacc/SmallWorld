      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, nextcloud-oidc]]
          policy: !KeyOf policy-superuser
          order: 10
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, marketing-tool]]
          group: !KeyOf group-tools
          order: 0
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, marketing-tool]]
          policy: !KeyOf policy-superuser
          order: 10
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, open-webui]]
          group: !KeyOf group-tools
          order: 0
        attrs:

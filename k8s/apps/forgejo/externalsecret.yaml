apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
spec:
  refreshInterval: 1m
  target:
    name: forgejo-secrets
  data:
    - secretKey: FORGEJO_DB_USERNAME
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/forgejo
        property: db-username
    - secretKey: FORGEJO_DB_PASSWORD
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/forgejo
        property: db-password
    - secretKey: FORGEJO__security__SECRET_KEY
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/forgejo
        property: secret-key
    - secretKey: FORGEJO__security__INTERNAL_TOKEN
      sourceRef:
        storeRef:
          name: vault
          kind: ClusterSecretStore
      remoteRef:
        key: secret/forgejo
        property: internal-token

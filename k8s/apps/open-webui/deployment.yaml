apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: asta
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.13.0
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: OPENAI_API_BASE_URL
              value: http://altair-egress.tailscale.svc.cluster.local:8080/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OPENAI_API_KEY
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: DEFAULT_MODELS
              value: gpt-oss-20b-uncensored
            - name: TASK_MODEL_EXTERNAL
              value: gpt-oss-20b-uncensored
            - name: ENABLE_TITLE_GENERATION
              value: "false"
            - name: ENABLE_TAGS_GENERATION
              value: "false"
            - name: ENABLE_AUTOCOMPLETE_GENERATION
              value: "false"
            - name: ENABLE_FOLLOW_UP_GENERATION
              value: "false"
            - name: WEBUI_URL
              value: https://chat.${TAILNET_DOMAIN}
            - name: WEBUI_AUTH
              value: "true"
            # Trusted-header login creates the first user via signup(), which 403s
            # if either of these is false.
            - name: ENABLE_LOGIN_FORM
              value: "true"
            - name: ENABLE_SIGNUP
              value: "true"
            - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
              value: X-authentik-email
            - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
              value: X-authentik-name
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "900"
            - name: AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST
              value: "5"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: duckduckgo
            - name: WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "10"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data

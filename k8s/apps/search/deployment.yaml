apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: ghcr.io/dev-stacc/biggerworldsearch:20261112005657-a7cda44ba51bdd848b92f166a309203e53d386fc # {"$imagepolicy": "flux-system:search"}
          ports:
            - containerPort: 3000
          env:
            - name: FOURGET_BASE
              value: http://fourget.fourget.svc.cluster.local
            - name: FOURGET_SCRAPER
              value: ddg
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

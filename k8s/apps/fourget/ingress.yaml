apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fourget
  namespace: fourget
spec:
  ingressClassName: nginx
  rules:
    - host: search.${TAILNET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fourget
                port:
                  number: 80

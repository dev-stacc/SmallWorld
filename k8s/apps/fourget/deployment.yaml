apiVersion: apps/v1
kind: Deployment
metadata:
  name: fourget
  namespace: fourget
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fourget
  template:
    metadata:
      labels:
        app: fourget
    spec:
      containers:
        - name: fourget
          image: docker.io/luuul/4get@sha256:926be838e8303c0b5bf7a8e01c8232efb73e76fbed307a2f29c7ef4ddc3b4275
          ports:
            - containerPort: 80
          env:
            - name: FOURGET_PROTO
              value: http
            - name: FOURGET_SERVER_NAME
              value: cluster
            - name: FOURGET_SERVER_SHORT_DESCRIPTION
              value: proxy search
            - name: FOURGET_DEFAULT_THEME
              value: biggerworld
            - name: FOURGET_API_ENABLED
              value: "true"
            - name: FOURGET_ADDRESSES
              value: https://search.${TAILNET_DOMAIN}
            - name: FOURGET_INSTANCES
              value: https://search.${TAILNET_DOMAIN}
          volumeMounts:
            - name: theme
              mountPath: /var/www/html/4get/static/themes
              readOnly: true
            - name: apache-conf
              mountPath: /etc/apache2/conf.d/zz-forwarded.conf
              subPath: forwarded.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "2"
      volumes:
        - name: theme
          configMap:
            name: fourget-theme
        - name: apache-conf
          configMap:
            name: fourget-apache
